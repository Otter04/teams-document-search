<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 검색 · RAG</title><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#182b3b;background:#f4f6f7}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:56px auto;padding:0 24px}header{margin-bottom:28px}.eyebrow{font-size:13px;letter-spacing:.12em;color:#39756c}h1{font-size:34px;letter-spacing:-1px;margin:12px 0}p{line-height:1.6;color:#5d6b73}form{display:flex;gap:10px;margin:24px 0}input{flex:1;min-width:0;border:1px solid #bdcacb;border-radius:10px;padding:16px;font-size:17px}button{border:0;border-radius:10px;background:#215b53;color:white;padding:0 24px;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#status{min-height:25px;color:#35695e}article{background:white;border:1px solid #dce4e5;border-radius:14px;margin:18px 0;padding:24px}h2{font-size:18px;overflow-wrap:anywhere;margin:0 0 10px}.meta,.location,.muted{font-size:13px;color:#6e7b82}.evidence{border-left:3px solid #b9d5ce;margin:16px 0;padding:0 0 0 14px;white-space:pre-wrap;line-height:1.65}mark{background:#e2efd4;border-radius:2px}.location{display:block;margin-top:5px}details{border-top:1px solid #edf0f1;padding-top:12px;margin-top:16px}summary{cursor:pointer;font-size:13px;color:#357568}li{font-size:13px;margin:8px 0;overflow-wrap:anywhere}.error{color:#a33}a{color:#236e63}.note{font-size:12px;padding-top:24px;border-top:1px solid #dce4e5}.condition{font-size:13px;background:#e9f0ed;border-radius:8px;padding:10px 14px;white-space:pre-wrap} @media(max-width:600px){main{margin:24px auto;padding:0 16px}h1{font-size:28px}button{padding:0 16px}article{padding:18px}}
.flow{margin-top:22px}.flow-head{font-size:20px;margin:28px 0 8px}.branch-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stage{background:#fff;border:1px solid #dce4e5;border-radius:12px;padding:18px;margin:14px 0;min-width:0}.stage h3{margin:0 0 8px;font-size:16px}.stage-note{font-size:13px;margin:8px 0;color:#5d6b73}.rank-list{list-style:none;padding:0;margin:0}.rank-row{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:12px 0;border-top:1px solid #edf0f1}.rank-no{font-size:17px;color:#236e63;font-weight:700}.rank-title{font-size:14px;font-weight:600;overflow-wrap:anywhere}.chunk{font-size:12px;color:#64777d;overflow-wrap:anywhere;margin-top:5px}.rank-origin{font-size:12px;color:#236e63;margin:6px 0}.preview{font-size:12px;color:#6e7b82;white-space:pre-wrap;line-height:1.5;margin:5px 0}.rank-more{max-height:480px;overflow:auto}.pending{color:#78918d}.stage details{margin:8px 0;padding-top:8px}.stage-summary{font-size:12px;color:#4d6963}.rank-final{font-size:13px;color:#236e63;margin-bottom:10px}@media(max-width:700px){.branch-grid{grid-template-columns:1fr}.stage{padding:14px}}
</style><main><header><div class="eyebrow">RAG · DOCUMENT SEARCH · 개발 확인용</div><h1>필요한 문서를 찾아보세요</h1><p id="corpus-info">연결된 예비 문서에서 검색합니다. 결과에는 원문 발췌와 근거 위치가 표시됩니다.</p></header>
<form id="form"><input id="query" aria-label="검색어" placeholder="예: 청람정밀 MES 고도화 계약서" maxlength="1000" required autocomplete="off"><button id="button">검색</button></form>
<div id="status" role="status" aria-live="polite"></div><div id="conditions"></div><section id="flow" class="flow" aria-label="검색 단계별 순위"></section><section id="results" aria-label="검색 결과"></section>
<p class="note">Orin · Elasticsearch Nori/BM25 + bge-m3 · 검색 기록은 저장하지 않습니다.<br>예비 자료에는 SharePoint 링크가 없어 원본 열기를 제공하지 않습니다. 생성형 답변은 만들지 않습니다.</p></main>
<script>
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
const names={client:'거래처',document_type:'문서 종류',target_system:'대상 시스템',document_date:'문서 일자',cover_date:'표지 날짜',written_date:'작성일',file_modified_at:'파일 수정일',status:'상태',execution_result:'실행 결과',contract_period:'계약 적용 기간',log_start:'로그 시작일',currency:'통화',vat:'부가세'};
function conditionText(obj){return Object.entries(obj).map(([k,v])=>(names[k]||k)+': '+(typeof v==='object'?((v.gte||v.gt||'')+' ~ '+(v.lte||v.lt||'')+(v.lt?' 미만':'')):v)).join(' · ')}
function quoteView(ex){const q=el('div',undefined,'evidence');let n=0;const spans=ex.highlight_spans||[];for(const [a,b] of spans){if(a<n)continue;q.append(document.createTextNode(ex.text.slice(n,a)),el('mark',ex.text.slice(a,b)));n=b;}q.append(document.createTextNode(ex.text.slice(n)),el('span',ex.location,'location'));return q}

const stageTitles={bm25:'1. 키워드 검색 순위',vector:'2. 의미 검색 순위',combined:'3. 결합된 청크 순위',adjusted:'4. 순위 조정 후 청크',date_order:'4. 요청한 날짜순 청크'};
let stageElements={};
function stageBox(id,parent){const box=el('section',undefined,'stage');box.append(el('h3',stageTitles[id]));const body=el('div','대기 중','pending');box.append(body);parent.append(box);stageElements[id]=body;return body;}
function resetFlow(){const flow=document.querySelector('#flow');flow.replaceChildren();stageElements={};flow.append(el('h2','검색 순위 살펴보기','flow-head'),el('p','각 항목은 문서의 일부인 청크입니다. 같은 문서가 여러 순위에 나올 수 있습니다.','stage-note'));const grid=el('div',undefined,'branch-grid');flow.append(grid);stageBox('bm25',grid);stageBox('vector',grid);stageBox('combined',flow);}
function rankItem(row,kind){const li=el('li',undefined,'rank-row'),body=el('div');li.append(el('div',row.rank+'','rank-no'),body);body.append(el('div',row.title,'rank-title'),el('div',row.doc_id+' · '+row.chunk_id,'chunk'));if(row.locations?.length)body.append(el('div',row.locations.join(' · '),'chunk'));
if(kind==='combined'){const ranks=row.branch_ranks||{};body.append(el('div','키워드 '+(ranks.bm25?ranks.bm25+'위':'후보 밖')+' · 의미 '+(ranks.vector?ranks.vector+'위':'후보 밖'),'rank-origin'));}
if(kind==='adjusted'&&row.combined_rank)body.append(el('div','결합 '+row.combined_rank+'위 → 조정 후 '+row.rank+'위','rank-origin'));
if(row.preview){const detail=el('details');detail.append(el('summary','청크 내용 일부'),el('div',row.preview,'preview'));body.append(detail);}return li;}
function rankStage(kind,data){const target=stageElements[kind]||stageBox(kind,document.querySelector('#flow'));target.className='';target.replaceChildren();
let note=data.rows.length+'개 청크';if(kind==='combined'&&data.date_order_overrides)note='결합 결과 참고용 · 이 질문의 최종 순서는 전체 일치 자료의 날짜순으로 결정합니다.';
if(kind==='adjusted')note+=' · '+data.ranker+(data.source_review_applied?' + Qwen 원문 근거 대조':' 코드 기반 순위 조정');if(kind==='date_order')note='전체 일치 청크의 '+names[data.sort.field]+' '+(data.sort.direction==='desc'?'최신순':'오래된 순')+' · 결합 상위 후보로 제한하지 않음';target.append(el('p',note,'stage-note'));
const list=el('ol',undefined,'rank-list');data.rows.slice(0,5).forEach(row=>list.append(rankItem(row,kind)));target.append(list);
if(data.rows.length>5){const more=el('details');more.append(el('summary','나머지 '+(data.rows.length-5)+'개 청크 순위 보기'));const rest=el('ol',undefined,'rank-list rank-more');data.rows.slice(5).forEach(row=>rest.append(rankItem(row,kind)));more.append(rest);target.append(more);}if(!data.rows.length)target.append(el('p','이 단계의 후보가 없습니다.','muted'));}
function finish(data){const status=document.querySelector('#status'),results=document.querySelector('#results'),conditions=document.querySelector('#conditions');results.replaceChildren();conditions.replaceChildren();
status.textContent=data.status==='needs_clarification'?'조건을 더 구체적으로 적어 주세요. 여러 거래처, 날짜 범위 또는 제외 조건을 확인해 주세요.':data.results.length+'개 문서 · '+data.timings.total_seconds.toFixed(2)+'초';
if(data.status==='no_results')status.textContent='조건에 맞는 문서가 없습니다.';
if(data.status==='needs_clarification'){const warnings=data.query_plan.warnings||[];if(warnings.includes('invalid_calendar_date'))status.textContent='존재하지 않는 날짜입니다. 연도·월·일을 확인해 주세요.';else if(warnings.includes('unsupported_calendar_expression')||warnings.includes('multiple_date_ranges'))status.textContent='이 날짜 범위 표현은 아직 지원하지 않습니다. 연도를 포함한 단일 월·일 또는 연도 전체로 검색해 주세요.';}
if(data.status==='needs_clarification')for(const target of Object.values(stageElements))target.textContent='질문 조건 확인이 필요하여 검색하지 않았습니다.';
const p=data.query_plan;let c=conditionText(p.filters);if(Object.keys(p.soft_conditions||{}).length)c+='\n우선순위 조건: '+conditionText(p.soft_conditions);if(p.boost.latest_version)c+='\n최신 버전 우선';if(p.requested_version_order==='earliest')c+='\n처음 버전 우선: 검색된 같은 문서의 숫자 버전을 비교합니다.';if(p.date_interpretation)c+='\n'+p.date_interpretation.message;if(Object.keys(p.required_dates||{}).length)c+='\n지정한 기간 안의 자료만 표시합니다. 결과가 없어도 기간을 넓히지 않습니다.';if(p.date_role_note)c+='\n'+p.date_role_note;if(p.job_requirement)c+='\n요청한 작업이 작업명에서 확인되는 로그만 표시합니다.';if(p.content_requirement)c+='\n포함 내용: 네트워크 구성도 (장비·연결 근거 확인)';if(p.sort)c+='\n'+names[p.sort.field]+' '+(p.sort.direction==='desc'?'최신순':'오래된 순');if(p.llm.status==='rules_fallback')c+='\n질의 분석 모델 응답을 채택하지 못해 규칙 분석으로 검색했습니다.';if(p.source_review?.status==='accepted')c+='\n질문과 후보 원문을 대조해 근거가 있는 문서를 우선했습니다. 근거: '+p.source_review.quote;else if(p.source_review?.status==='baseline_fallback')c+='\n추가 원문 대조를 완료하지 못해 기존 검색 순위를 표시합니다.';if(data.relaxed_conditions?.length)c+='\n검색 범위를 넓힌 조건: '+data.relaxed_conditions.map(x=>names[x.field]||x.field).join(', ');if(c.trim())conditions.append(el('div',c.trim(),'condition'));
if(data.date_coverage){const dc=data.date_coverage;conditions.append(el('p',names[dc.field]+' 확인 '+dc.dated_documents+'개 · 미확인 '+dc.undated_documents+'개. 미확인 문서는 다른 날짜로 대신 정렬하지 않습니다.','muted'));}
results.append(el('h2','최종 문서 순위','flow-head'));for(const [card,undated] of [...data.results.map(c=>[c,false]),...(data.undated_results||[]).map(c=>[c,true])]){if(undated&&card===(data.undated_results||[])[0])results.append(el('h2',names[p.sort.field]+' 미확인 · 별도 결과 (최대 5개)'));const a=el('article');if(!undated)a.append(el('div',(data.results.indexOf(card)+1)+'위 · 문서별로 묶은 결과','rank-final'));a.append(el('h2',card.title),el('div',card.doc_id+' · '+[card.metadata.client,card.metadata.document_type,p.sort?(names[p.sort.field]+': '+(undated?'미확인':card.metadata[p.sort.field])):('문서 일자: '+(card.metadata.document_date||'미확인'))].filter(Boolean).join(' · '),'meta'));for(const proof of card.content_evidence||[])a.append(el('p','네트워크 구성도 포함 · '+proof.location+' · '+proof.network_labels.join(' / '),'condition'));for(const ex of card.excerpts)a.append(quoteView(ex));if(!card.excerpts.length)a.append(el('p','이 결과는 검색용 추출 구조에 일치했습니다. 표시할 직접 원문 발췌는 없습니다.','muted'));if(card.url&&/^https:\/\//.test(card.url)){const link=el('a','원본 열기');link.href=card.url;link.target='_blank';link.rel='noopener noreferrer';a.append(link)}const details=el('details');details.append(el('summary','파일 위치와 다른 버전 '+card.other_versions.length+'개'),el('p',card.source_path,'muted'));const ul=el('ul');for(const v of card.other_versions)ul.append(el('li',v.doc_id+' · '+v.title+(v.latest?' · 최신':'')+(v.same_content?' · 동일 파일 사본':'')));details.append(ul);a.append(details);results.append(a)}

}

function stageEvent(event){const status=document.querySelector('#status'),conditions=document.querySelector('#conditions');const d=event.data;
if(event.stage==='started')status.textContent='질문 조건을 확인하고 있습니다…';
else if(event.stage==='analysis'){const p=d.query_plan;conditions.replaceChildren(el('div','검색어: '+(p.keywords||'조건에 맞는 전체 자료')+'\n'+conditionText(p.conditions),'condition'));status.textContent='질문을 분석했습니다. 검색을 준비하고 있습니다…';}
else if(event.stage==='reviewing'){status.textContent='질문과 후보 원문을 대조하고 있습니다…';}
else if(event.stage==='searching'){for(const kind of ['bm25','vector']){stageElements[kind].replaceChildren(el('p','검색 중…','pending'));}status.textContent='키워드 검색과 의미 검색을 실행하고 있습니다…';}
else if(event.stage==='relaxed'){conditions.append(el('p','결과가 없어 '+(names[d.field]||d.field)+' 조건을 완화하여 다시 검색합니다.','muted'));}
else if(stageTitles[event.stage]){rankStage(event.stage,d);status.textContent=stageTitles[event.stage]+' 확인 완료';}
else if(event.stage==='complete')finish(d);
else if(event.stage==='error')throw Error(d.message);
}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const query=document.querySelector('#query').value.trim();if(!query)return;const button=document.querySelector('#button'),status=document.querySelector('#status');button.disabled=true;status.className='';document.querySelector('#results').replaceChildren();document.querySelector('#conditions').replaceChildren();resetFlow();let reader;try{
const response=await fetch('/search/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});if(!response.ok){const error=await response.json();throw Error(error.detail||'검색에 실패했습니다.');}
reader=response.body.getReader();const decoder=new TextDecoder();let buffer='',complete=false;
function consume(line){if(!line.trim())return;const event=JSON.parse(line);stageEvent(event);if(event.stage==='complete')complete=true;}
while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let pos;while((pos=buffer.indexOf('\n'))>=0){consume(buffer.slice(0,pos));buffer=buffer.slice(pos+1);}}
buffer+=decoder.decode();if(buffer.trim())consume(buffer);if(!complete)throw Error('검색 연결이 끊겼습니다. 중간 순위만 표시된 상태입니다. 다시 검색해 주세요.');
}catch(err){status.textContent=err.message;status.className='error';document.querySelector('#flow').append(el('p','검색이 완료되지 않았습니다. 위 순위는 중간 결과입니다.','error'));}finally{if(reader)await reader.cancel().catch(()=>{});button.disabled=false;}});
fetch('/health').then(r=>{if(!r.ok)throw Error('health');return r.json()}).then(h=>{if(h.ready&&Number.isInteger(h.documents))document.querySelector('#corpus-info').textContent=h.documents+'개 예비 문서에서 검색합니다. 결과에는 원문 발췌와 근거 위치가 표시됩니다.';}).catch(()=>{});
</script></html>
