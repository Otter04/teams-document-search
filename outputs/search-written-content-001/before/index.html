<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서 검색 · RAG</title><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#182b3b;background:#f4f6f7}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:56px auto;padding:0 24px}header{margin-bottom:28px}.eyebrow{font-size:13px;letter-spacing:.12em;color:#39756c}h1{font-size:34px;letter-spacing:-1px;margin:12px 0}p{line-height:1.6;color:#5d6b73}form{display:flex;gap:10px;margin:24px 0}input{flex:1;min-width:0;border:1px solid #bdcacb;border-radius:10px;padding:16px;font-size:17px}button{border:0;border-radius:10px;background:#215b53;color:white;padding:0 24px;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#status{min-height:25px;color:#35695e}article{background:white;border:1px solid #dce4e5;border-radius:14px;margin:18px 0;padding:24px}h2{font-size:18px;overflow-wrap:anywhere;margin:0 0 10px}.meta,.location,.muted{font-size:13px;color:#6e7b82}.evidence{border-left:3px solid #b9d5ce;margin:16px 0;padding:0 0 0 14px;white-space:pre-wrap;line-height:1.65}mark{background:#e2efd4;border-radius:2px}.location{display:block;margin-top:5px}details{border-top:1px solid #edf0f1;padding-top:12px;margin-top:16px}summary{cursor:pointer;font-size:13px;color:#357568}li{font-size:13px;margin:8px 0;overflow-wrap:anywhere}.error{color:#a33}a{color:#236e63}.note{font-size:12px;padding-top:24px;border-top:1px solid #dce4e5}.condition{font-size:13px;background:#e9f0ed;border-radius:8px;padding:10px 14px;white-space:pre-wrap} @media(max-width:600px){main{margin:24px auto;padding:0 16px}h1{font-size:28px}button{padding:0 16px}article{padding:18px}}
</style><main><header><div class="eyebrow">RAG · DOCUMENT SEARCH · 개발 확인용</div><h1>필요한 문서를 찾아보세요</h1><p>110개 예비 문서에서 검색합니다. 결과에는 원문 발췌와 근거 위치가 표시됩니다.</p></header>
<form id="form"><input id="query" aria-label="검색어" placeholder="예: 청람정밀 MES 고도화 계약서" maxlength="1000" required autocomplete="off"><button id="button">검색</button></form>
<div id="status" role="status" aria-live="polite"></div><div id="conditions"></div><section id="results" aria-label="검색 결과"></section>
<p class="note">Orin · Elasticsearch Nori/BM25 + bge-m3 · 검색 기록은 저장하지 않습니다.<br>예비 자료에는 SharePoint 링크가 없어 원본 열기를 제공하지 않습니다. 생성형 답변은 만들지 않습니다.</p></main>
<script>
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;};
const names={client:'거래처',document_type:'문서 종류',target_system:'대상 시스템',document_date:'문서 일자',cover_date:'표지 날짜',written_date:'작성일',file_modified_at:'파일 수정일',status:'상태',execution_result:'실행 결과',log_start:'로그 시작일',currency:'통화',vat:'부가세'};
function conditionText(obj){return Object.entries(obj).map(([k,v])=>(names[k]||k)+': '+(typeof v==='object'?JSON.stringify(v):v)).join(' · ')}
function quoteView(ex){const q=el('div',undefined,'evidence');let n=0;const spans=ex.highlight_spans||[];for(const [a,b] of spans){if(a<n)continue;q.append(document.createTextNode(ex.text.slice(n,a)),el('mark',ex.text.slice(a,b)));n=b;}q.append(document.createTextNode(ex.text.slice(n)),el('span',ex.location,'location'));return q}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const query=document.querySelector('#query').value.trim();if(!query)return;const button=document.querySelector('#button');button.disabled=true;const status=document.querySelector('#status'),results=document.querySelector('#results'),conditions=document.querySelector('#conditions');status.textContent='문서를 찾고 있습니다…';status.className='';results.replaceChildren();conditions.replaceChildren();try{const r=await fetch('/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});const data=await r.json();if(!r.ok)throw Error(data.detail||'검색에 실패했습니다.');
status.textContent=data.status==='needs_clarification'?'조건을 더 구체적으로 적어 주세요. 여러 거래처, 날짜 범위 또는 제외 조건을 확인해 주세요.':data.results.length+'개 문서 · '+data.timings.total_seconds.toFixed(2)+'초';
const p=data.query_plan;let c=conditionText(p.filters);if(Object.keys(p.soft_conditions||{}).length)c+='\n우선순위 조건: '+conditionText(p.soft_conditions);if(p.boost.latest_version)c+='\n최신 버전 우선';if(p.sort)c+='\n파일 수정일 '+(p.sort.direction==='desc'?'최신순':'오래된 순');if(p.llm.status==='rules_fallback')c+='\n질의 분석 모델 응답을 채택하지 못해 규칙 분석으로 검색했습니다.';if(data.relaxed_conditions?.length)c+='\n검색 범위를 넓힌 조건: '+data.relaxed_conditions.map(x=>names[x.field]||x.field).join(', ');if(c.trim())conditions.append(el('div',c.trim(),'condition'));
for(const card of data.results){const a=el('article');a.append(el('h2',card.title),el('div',card.doc_id+' · '+[card.metadata.client,card.metadata.document_type,card.metadata.document_date].filter(Boolean).join(' · '),'meta'));for(const ex of card.excerpts)a.append(quoteView(ex));if(!card.excerpts.length)a.append(el('p','이 결과는 검색용 추출 구조에 일치했습니다. 표시할 직접 원문 발췌는 없습니다.','muted'));if(card.url&&/^https:\/\//.test(card.url)){const link=el('a','원본 열기');link.href=card.url;link.target='_blank';link.rel='noopener noreferrer';a.append(link)}const details=el('details');details.append(el('summary','파일 위치와 다른 버전 '+card.other_versions.length+'개'),el('p',card.source_path,'muted'));const ul=el('ul');for(const v of card.other_versions)ul.append(el('li',v.doc_id+' · '+v.title+(v.latest?' · 최신':'')+(v.same_content?' · 동일 파일 사본':'')));details.append(ul);a.append(details);results.append(a)}
}catch(err){status.textContent=err.message;status.className='error'}finally{button.disabled=false}});
</script></html>
