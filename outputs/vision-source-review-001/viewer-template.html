<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>비전 파싱 · 원문 대조</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172539;font:15px/1.65 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}header{padding:24px 32px;background:#172d47;color:#fff}h1{font-size:25px;margin:0 0 6px}header p{margin:0;color:#d3dfed}nav{position:sticky;top:0;z-index:3;background:#fff;padding:14px 24px;box-shadow:0 2px 8px #0001;display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,button{font:inherit;padding:7px 12px;border:1px solid #bbc9da;border-radius:7px;background:white;color:#172539}button{cursor:pointer}button:hover{background:#e8eef8}main{padding:20px 24px}.grid{display:grid;grid-template-columns:minmax(400px,1.15fr) repeat(2,minmax(290px,1fr));gap:16px;align-items:start}section{background:white;border:1px solid #dce3ed;border-radius:10px;min-width:0;padding:16px}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:18px 0 6px}.photo{position:relative}.photo img{display:block;width:100%;height:auto}.photo svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.good{color:#086852}.bad{color:#ab2d35}.note{background:#fff2d8;border-left:4px solid #d99a23;padding:12px 16px;margin-bottom:16px}.muted{font-size:13px;color:#5d6c7d}.badge{display:inline-block;padding:2px 8px;background:#edf1f7;border-radius:5px;margin:2px 3px 2px 0;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fa;border-radius:6px;padding:10px;font-size:12px;max-height:430px;overflow:auto}details{border-top:1px solid #e7eaf0;padding:8px 0}summary{cursor:pointer;font-weight:600}.finding{margin:9px 0;padding:9px;background:#fff6f4;border-radius:5px;font-size:13px}.literal{border-bottom:1px solid #edf0f5;padding:6px 0;white-space:pre-wrap;font-size:13px}.literal span{font-size:11px;color:#697c92}a{color:#1d5bb1}.stat{font-size:20px;font-weight:700}.source-refs{max-height:350px;overflow:auto}#case{max-width:1500px}body.zoom .grid{grid-template-columns:1fr}body.zoom .photo{max-width:1500px;margin:auto}@media(max-width:1100px){.grid{grid-template-columns:1fr}.photo{max-width:900px;margin:auto}header{padding:20px}main{padding:12px}}
</style><header><h1>비전 파싱 · 원문 대조</h1><p>132장 × 두 모델의 기존 응답 · 추가 호출 없음 · 검색 지표 제외</p></header>
<nav><label>문서/페이지 <select id="pick" aria-label="문서 페이지 선택"></select></label><button id="prev">이전</button><button id="next">다음</button><button id="scan">스캔 사례</button><button id="zoom">원본 크게 보기</button><label><input type="checkbox" id="boxes"> 표 좌표 비교</label><a href="README.md">평가 보고서</a></nav>
<main><div class="note">내용 보존 점수에는 중간 종료 응답의 <b>완성된 필드만</b> 포함합니다. 정상 JSON 채택과 구분합니다. 원본 기준은 AI 검수 초안이며 독립 사람 검수 전입니다.</div><div id="case"></div><div class="grid"><section><h2 id="source-title"></h2><p class="muted">표 좌표: 초록=원본 · 주황=3.6 · 보라=VL. 점/선으로 붕괴된 좌표는 표시가 어려울 수 있습니다.</p><div class="photo"><img id="source" alt="평가 대상 원본 이미지"><svg id="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg></div><details><summary>원본 기준 항목</summary><pre id="reference" class="source-refs"></pre></details></section><section id="m0"></section><section id="m1"></section></div></main>
<script>const DATA=/*DATA*/{};
const $=id=>document.getElementById(id), keys=Object.keys(DATA), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const k of keys){const o=document.createElement('option');o.value=k;o.textContent=k;$('pick').append(o)}
function prf(s){return `${s.correct}/${s.expected} 회수 · 출력 ${s.observed}개 · 정밀도 ${(s.precision*100).toFixed(1)}%`}
function render(){const key=$('pick').value,d=DATA[key];$('source-title').textContent=key;$('source').src=d.image;$('reference').textContent=JSON.stringify(d.ref,null,2);
const c=d.case;$('case').innerHTML=c?`<div class="note"><b>${esc(c.category)}</b><br>원본: ${esc(c.source)}<br>3.6: ${esc(c.q36)}<br>VL: ${esc(c.vl)}<br>${esc(c.judgment)}</div>`:'';
d.pair.forEach((p,i)=>{const r=p.report,cv=r.coverage,missing=cv.details.filter(x=>!x.compatible);$('m'+i).innerHTML=`<h2>${esc(p.model)}</h2><div class="stat">${cv.compatible}/${cv.total} 기준 항목 보존</div><span class="badge ${r.json_complete?'good':'bad'}">${r.json_complete?'JSON 완결':'JSON 중간 종료'}</span><span class="badge ${r.common_json_valid?'good':'bad'}">공통 JSON ${r.common_json_valid?'형식 통과':'채택 실패'}</span><p class="muted">형식 통과가 원문 정확도 합격은 아닙니다. 호환 표기 허용 기준.</p><h3>구조</h3><p>표 ${r.tables.tables.length}개 / 추가 표 ${r.tables.unmatched_output_tables.length}개<br>노드 ${prf(r.graph_compatible.nodes)}<br>연결 ${prf(r.graph_compatible.edges)}</p><details open><summary>원문 필드 불일치 ${missing.length}개</summary>${missing.map(x=>`<div class="finding"><b>원본</b> ${esc(x.expected)}<br><b>가까운 출력</b> ${esc(x.nearest||'없음')}${r.source_items_only_in_claims.includes(x.expected)?'<br><b>claims에서 발견: 필드 배치 오류</b>':''}</div>`).join('')||'<p class="good">기준 항목 보존</p>'}</details><details><summary>중복 ${r.duplicate_source_phrases.length}개 구절 / 상태·좌표</summary><pre>${esc(JSON.stringify({duplicates:r.duplicate_source_phrases,unreadable_cells_with_text:r.unreadable_cells_with_text,complete_with_unreadable_cells:r.complete_with_unreadable_cells,disjoint_bboxes:r.disjoint_text_or_node_bboxes,validation_errors:r.validation_errors},null,2))}</pre></details><details><summary>표 상세</summary><pre>${esc(JSON.stringify(r.tables,null,2))}</pre></details><details><summary>추출 원문 ${r.extracted_literals.length}개</summary>${r.extracted_literals.map(x=>`<div class="literal"><span>${esc(x.path)}</span><br>${esc(x.text)}</div>`).join('')}</details><details><summary>모델 구조 출력${r.recovered_prefix_only?' (부분 진단, 정상 JSON 아님)':''}</summary><pre>${esc(JSON.stringify(p.wire,null,2))}</pre></details><a href="${esc(p.response_url)}">변경하지 않은 원응답 파일</a>`});overlay();}
function overlay(){const d=DATA[$('pick').value];$('overlay').innerHTML='';if(!$('boxes').checked)return;const groups=[[d.ref.tables,'#0a986b'],[d.pair[0].wire.tables||[],'#e78218'],[d.pair[1].wire.tables||[],'#8c42c9']];for(const [tables,color] of groups)for(const t of tables){const b=t.bbox;if(!b||b.length!==4)continue;const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const [a,v] of Object.entries({x:b[0]*1000,y:b[1]*1000,width:Math.max(2,(b[2]-b[0])*1000),height:Math.max(2,(b[3]-b[1])*1000),fill:'none',stroke:color,'stroke-width':3}))rect.setAttribute(a,v);$('overlay').append(rect)}}
$('pick').onchange=render;$('prev').onclick=()=>{$('pick').selectedIndex=($('pick').selectedIndex+keys.length-1)%keys.length;render()};$('next').onclick=()=>{$('pick').selectedIndex=($('pick').selectedIndex+1)%keys.length;render()};$('scan').onclick=()=>{$('pick').value='D-102-vision-page1';render()};$('zoom').onclick=()=>document.body.classList.toggle('zoom');$('boxes').onchange=overlay;$('pick').value='D-044-vision-page2';render();
</script></html>
